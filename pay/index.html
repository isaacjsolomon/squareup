<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="referrer" content="no-referrer">
 <title>Payment request · DoWeo</title>
 <link rel="icon" href="/images/logo.png">
 <style>
 *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0A1B2E;color:#F3F8FC;font:16px/1.55 system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:26px}
 main{width:min(100%,460px);border:1px solid #355E72;border-radius:22px;background:#102B40;padding:28px;box-shadow:0 22px 45px color-mix(in srgb, #0A1B2E 33.3%, transparent)}
 header{display:flex;align-items:center;gap:12px;margin-bottom:26px;font-weight:800;font-size:20px}header img{height:40px;width:40px;border-radius:9px}
 .label{color:#ABC6D7;font-size:13px}#amount{font-size:38px;letter-spacing:-1.5px;font-weight:850;margin:8px 0 12px}
 #note{overflow-wrap:anywhere}#status{font-size:14px;color:#ABC6D7}
 a{color:#ABC6D7}a.home{display:inline-flex;margin-top:22px;padding:12px 18px;background:#ABC6D7;color:#102B40;border-radius:11px;text-decoration:none;font-weight:750}
 </style>
</head>
<body><main><header><img src="/images/logo.png" alt="">DoWeo</header>
 <p class="label">Payment request</p><p id="amount">Loading…</p><p id="note"></p><p id="status" role="status" aria-live="polite">Verifying this request.</p>
 <p class="label">DoWeo does not collect or transfer money on this page. Confirm payment details with the sender before paying through your chosen payment service.</p>
 <a class="home" href="/">Open DoWeo</a>
</main>
<script>
(async()=>{
 const token=new URLSearchParams(location.search).get('token');
 const amount=document.getElementById('amount'),note=document.getElementById('note'),status=document.getElementById('status');
 if(!/^[0-9a-f]{8}-[0-9a-f-]{27,36}$/i.test(token||'')){amount.textContent='Unavailable';status.textContent='Invalid request link.';return}
 try{
  const res=await fetch('/api/payment-preview/'+encodeURIComponent(token),{cache:'no-store'});
  const data=await res.json();
  if(!res.ok)throw Error(data.error||'Request unavailable.');
  amount.textContent=new Intl.NumberFormat(undefined,{style:'currency',currency:data.currency}).format(Number(data.amount));
  note.textContent=data.note||'No message included.';
  status.textContent='Request expires: '+new Date(data.expires_at).toLocaleString();
 }catch(e){amount.textContent='Unavailable';note.textContent='';status.textContent=e.message||'Request unavailable.'}
})();
</script></body>
</html>
