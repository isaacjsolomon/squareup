name: Deploy DoWeo to Cloudflare Pages

# Deploy merged changes to production; retain manual deployments.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy DoWeo Pages and API functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out DoWeo
        uses: actions/checkout@v4

      - name: Prepare Pages static assets
        run: |
          mkdir -p .pages-output
          cp index.html doweo-i18n.js doweo-translations.js manifest.webmanifest sw.js squareup-events.js beta-feedback.js weo-mascot.js weo-mascot.css weo-actions.js weo-actions.css weo-history.js doweo-localize-ui.js doweo-ui-catalog.mjs doweo-core-locales.mjs doweo-bills-mobile-dashboard.js doweo-bills-mobile-dashboard.css doweo-finance-planning.js doweo-trips-activity.js doweo-paylinks-currency.js doweo-trackers-tabs.css doweo-home-add-menu.js doweo-home-add-menu.css doweo-desktop-polish.css doweo-mobile-more-pages.js doweo-mobile-more-pages.css doweo-mobile-home-navy-cards.css doweo-first-run.js doweo-first-run.css doweo-split-bill-modal.css doweo-split-bill-modal.js doweo-backdrop-images.js .pages-output/
          # Bump these URLs in the published HTML to invalidate old browser-cached UI assets.
          sed -E -i 's#(doweo-bills-mobile-dashboard\.(css|js))\?v=[^\"]+#\1?v=20261116-overview-picker-v10#g' .pages-output/index.html
          # Version the cleaned tracker planning script to invalidate old broken navigation code.
          sed -i 's#src="/doweo-trips-activity.js"#src="/doweo-trips-activity.js?v=20261119-removed-category-tabs-v8"#g' .pages-output/index.html
          # Ensure iOS PWA installations load the refreshed translation catalog and fallbacks.
          sed -i 's#src="doweo-localize-ui.js"#src="doweo-localize-ui.js?v=20261121-mobile-locales-v1"#g' .pages-output/index.html
          cp doweo-tracker-header.css doweo-tracker-header.js .pages-output/
          mkdir -p .pages-output/third_party
          cp third_party/heic2any.min.js third_party/UTIF.js .pages-output/third_party/
          python3 - <<'PY'
          from pathlib import Path
          page = Path('.pages-output/index.html')
          html = page.read_text()
          css = '<link rel="stylesheet" href="/doweo-tracker-header.css?v=20261116-overview-picker-v10">'
          css += '<link rel="stylesheet" href="/doweo-trackers-tabs.css?v=20261119-retired-tabs-v8">'
          css += '<link rel="stylesheet" href="/doweo-home-add-menu.css?v=20261119-add-dropdown-v1">'
          css += '<link rel="stylesheet" href="/doweo-split-bill-modal.css?v=20261119-split-modal-v1">'
          css += '<link rel="stylesheet" href="/doweo-desktop-polish.css?v=20261120-desktop-consistency-v1">'
          css += '<link rel="stylesheet" href="/doweo-first-run.css?v=20261121-onboarding-v1">'
          css += '<link rel="stylesheet" href="/doweo-mobile-more-pages.css?v=20261121-static-install-v3">'
          css += '<link rel="stylesheet" href="/doweo-mobile-home-navy-cards.css?v=20261121-home-cards-v1">'
          js = '<script defer src="/doweo-tracker-header.js?v=20261116-overview-picker-v10"></script>'
          js += '<script defer src="/doweo-home-add-menu.js?v=20261119-add-dropdown-v1"></script>'
          js += '<script defer src="/doweo-split-bill-modal.js?v=20261119-split-modal-v1"></script>'
          js += '<script defer src="/doweo-backdrop-images.js?v=20261119-image-compat-v1"></script>'
          js += '<script defer src="/doweo-mobile-more-pages.js?v=20261121-static-install-v3"></script>'
          js += '<script defer src="/doweo-first-run.js?v=20261121-onboarding-v1"></script>'
          assert '</head>' in html and '</body>' in html
          html = html.replace('</head>', css + '</head>', 1).replace('</body>', js + '</body>', 1)
          page.write_text(html)
          PY
          cp -R icons images beta privacy terms .pages-output/
          cp robots.txt sitemap.xml .pages-output/
          mkdir -p .pages-output/.well-known
          cp .well-known/assetlinks.json .pages-output/.well-known/
          # Prevent green deployments with missing runtime translation modules.
          test -s .pages-output/doweo-desktop-polish.css
          test -s .pages-output/doweo-mobile-more-pages.js
          test -s .pages-output/doweo-first-run.js
          test -s .pages-output/doweo-first-run.css
          test -s .pages-output/doweo-mobile-more-pages.css
          test -s .pages-output/doweo-mobile-home-navy-cards.css
          test -s .pages-output/doweo-backdrop-images.js
          test -s .pages-output/third_party/heic2any.min.js
          test -s .pages-output/third_party/UTIF.js
          test -s .pages-output/doweo-core-locales.mjs
          test -s .pages-output/doweo-ui-catalog.mjs
          test -s .pages-output/doweo-localize-ui.js
          test -s .pages-output/beta/index.html
          test -s .pages-output/privacy/index.html
          test -s .pages-output/terms/index.html
          test -s functions/api/beta-signup.js
          cp beta/index.html .pages-output/beta.html
          node --test test/polls-api.test.mjs test/recent-expense-api.test.mjs test/tracker-loading-performance.test.mjs
          node --test test/mobile-ios-install-guide.test.mjs test/mobile-more-inspect.test.mjs test/doweo-mobile-more-flat-grid.test.mjs
          node scripts/verify-pages-assets.mjs .pages-output

      # Run Wrangler from the repository root so it discovers ./functions.
      # Uploading through the dashboard would not compile Pages Functions.
      - name: Deploy to doweo.pages.dev
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages-output --project-name=doweo --branch=main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production verification browser
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Verify production Home Add expense dropdown and retired tracker category tabs
        env:
          HOME_BASE_URL: https://doweo.app
        run: node --test test/home-add-dropdown.test.mjs
      - name: Verify real Split Bill popup and save with canonical ledger members on doweo.app
        env:
          SPLIT_BASE_URL: https://doweo.app
        run: node --test test/split-bill-member-modal.test.mjs
      - name: Upload Split Bill mobile verification screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-bill-mobile-verification
          path: test-results/split/
      - name: Verify published Bills assets and actual production rendering
        env:
          BILLS_BASE_URL: https://doweo.app
        run: |
          node scripts/verify-live-bills.mjs
          node --test test/recent-expense-details.test.mjs
          node --test test/polls-desktop-page.test.mjs
          node --test test/home-desktop-navigation.test.mjs
          node --test test/bills-full-app.test.mjs
      - name: Upload production Bills screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bills-production-screenshots
          path: test-results/bills/
