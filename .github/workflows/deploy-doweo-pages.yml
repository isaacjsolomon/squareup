name: Deploy DoWeo to Cloudflare Pages

# Deploy merged changes to production; retain manual deployments.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy DoWeo Pages and API functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out DoWeo
        uses: actions/checkout@v4

      - name: Prepare Pages static assets
        run: |
          mkdir -p .pages-output
          cp index.html doweo-i18n.js doweo-translations.js manifest.webmanifest sw.js squareup-events.js beta-feedback.js weo-mascot.js weo-mascot.css weo-actions.js weo-actions.css weo-history.js .pages-output/
          cp -R icons images .pages-output/

      # Run Wrangler from the repository root so it discovers ./functions.
      # Uploading through the dashboard would not compile Pages Functions.
      - name: Deploy to doweo.pages.dev
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages-output --project-name=doweo --branch=main
