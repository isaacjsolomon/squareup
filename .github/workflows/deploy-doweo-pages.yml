name: Deploy DoWeo to Cloudflare Pages

# Deploy merged changes to production; retain manual deployments.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy DoWeo Pages and API functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out DoWeo
        uses: actions/checkout@v4

      - name: Prepare Pages static assets
        run: |
          mkdir -p .pages-output
          cp index.html styles.css doweo-page-repairs.css doweo-i18n.js doweo-translations.js manifest.webmanifest sw.js squareup-events.js beta-feedback.js weo-mascot.js weo-mascot.css weo-actions.js weo-actions.css weo-history.js doweo-localize-ui.js doweo-ui-catalog.mjs doweo-core-locales.mjs doweo-bills-mobile-dashboard.js doweo-bills-mobile-dashboard.css doweo-finance-planning.js doweo-trips-activity.js doweo-paylinks-currency.js doweo-trackers-tabs.css doweo-home-add-menu.js doweo-home-add-menu.css doweo-desktop-polish.css doweo-mobile-more-pages.js doweo-mobile-more-pages.css doweo-mobile-home-navy-cards.css doweo-mint-dashboard.css doweo-reference-home.css doweo-global-search.js doweo-reference-home.js doweo-desktop-standalone.css doweo-desktop-standalone.js doweo-cashflow-analytics.js doweo-polls-dashboard.js doweo-polls-dashboard.css doweo-unified-shell.css doweo-unified-shell.js doweo-unified-localize.js doweo-unified-locales.mjs doweo-beta-nudge.css doweo-beta-nudge.js doweo-first-run.js doweo-first-run.css doweo-split-bill-modal.css doweo-split-bill-modal.js doweo-backdrop-images.js .pages-output/
          # Bump these URLs in the published HTML to invalidate old browser-cached UI assets.
          sed -E -i 's#(doweo-bills-mobile-dashboard\.(css|js))\?v=[^\"]+#\1?v=20261122-backdrop-colors-v1#g' .pages-output/index.html
          # Version the cleaned tracker planning script to invalidate old broken navigation code.
          sed -i 's#src="/doweo-trips-activity.js"#src="/doweo-trips-activity.js?v=20261119-removed-category-tabs-v8"#g' .pages-output/index.html
          # Ensure iOS PWA installations load the refreshed translation catalog and fallbacks.
          sed -i 's#src="doweo-localize-ui.js"#src="doweo-localize-ui.js?v=20261121-mobile-locales-v1"#g' .pages-output/index.html
          cp doweo-tracker-header.css doweo-tracker-header.js .pages-output/
          mkdir -p .pages-output/third_party
          cp third_party/heic2any.min.js third_party/UTIF.js .pages-output/third_party/
          python3 - <<'PY'
          from pathlib import Path
          page = Path('.pages-output/index.html')
          html = page.read_text()
          css = '<link rel="stylesheet" href="/doweo-tracker-header.css?v=20261122-backdrop-colors-v1">'
          css += '<link rel="stylesheet" href="/doweo-trackers-tabs.css?v=20261122-backdrop-colors-v1">'
          css += '<link rel="stylesheet" href="/doweo-home-add-menu.css?v=20261122-backdrop-colors-v1">'
          css += '<link rel="stylesheet" href="/doweo-split-bill-modal.css?v=20261122-backdrop-colors-v1">'
          css += '<link rel="stylesheet" href="/doweo-desktop-polish.css?v=20261122-backdrop-colors-v1">'
          css += '<link rel="stylesheet" href="/doweo-first-run.css?v=20261122-backdrop-colors-v1">'
          css += '<link rel="stylesheet" href="/doweo-mobile-more-pages.css?v=20261122-backdrop-colors-v1">'
          css += '<link rel="stylesheet" href="/doweo-mobile-home-navy-cards.css?v=20261122-backdrop-colors-v1">'
          js = '<script defer src="/doweo-tracker-header.js?v=20261122-backdrop-colors-v1"></script>'
          js += '<script defer src="/doweo-home-add-menu.js?v=20261122-backdrop-colors-v1"></script>'
          js += '<script defer src="/doweo-split-bill-modal.js?v=20261122-backdrop-colors-v1"></script>'
          js += '<script defer src="/doweo-backdrop-images.js?v=20261122-backdrop-colors-v1"></script>'
          js += '<script defer src="/doweo-mobile-more-pages.js?v=20261122-backdrop-colors-v1"></script>'
          js += '<script defer src="/doweo-first-run.js?v=20261122-backdrop-colors-v1"></script>'
          assert '</head>' in html and '</body>' in html
          import re
          marker_match = re.search(r'<link\s+rel="stylesheet"\s+href="/styles\.css\?v=[^"]+"[^>]*>', html)
          assert marker_match, "Unified design system stylesheet link missing"
          marker = marker_match.group(0)
          # Keep the consolidated sheet after all legacy external component CSS.
          html = html.replace(marker, css + marker, 1).replace('</body>', js + '</body>', 1)
          page.write_text(html)
          PY
          cp -R icons images beta privacy terms .pages-output/
          test -s .pages-output/images/instagram-app-icon.svg
          grep -Fq 'instagram-app-icon.svg?v=20261122-instagram-logo-v1' .pages-output/index.html
          cp robots.txt sitemap.xml _headers .pages-output/
          test -s .pages-output/_headers
          mkdir -p .pages-output/.well-known
          cp .well-known/assetlinks.json .pages-output/.well-known/
          # Prevent green deployments with missing runtime translation modules.
          test -s .pages-output/doweo-desktop-polish.css
          test -s .pages-output/doweo-mobile-more-pages.js
          test -s .pages-output/doweo-first-run.js
          test -s .pages-output/doweo-first-run.css
          test -s .pages-output/doweo-mobile-more-pages.css
          test -s .pages-output/doweo-mobile-home-navy-cards.css
          test -s .pages-output/doweo-mint-dashboard.css
          test -s .pages-output/doweo-beta-nudge.css
          test -s .pages-output/doweo-beta-nudge.js
          node --check .pages-output/doweo-beta-nudge.js
          test -s .pages-output/doweo-global-search.js
          test -s .pages-output/doweo-reference-home.css
          test -s .pages-output/doweo-reference-home.js
          node --check .pages-output/doweo-reference-home.js
          test -s .pages-output/doweo-desktop-standalone.css
          test -s .pages-output/doweo-desktop-standalone.js
          node --check .pages-output/doweo-desktop-standalone.js
          test -s .pages-output/doweo-cashflow-analytics.js
          node --check .pages-output/doweo-cashflow-analytics.js
          test -s .pages-output/doweo-polls-dashboard.js
          node --check .pages-output/doweo-polls-dashboard.js
          test -s .pages-output/doweo-polls-dashboard.css
          grep -Fq 'doweo-polls-dashboard.js?v=20261122-backdrop-colors-v1' .pages-output/index.html
          grep -Fq 'doweo-polls-dashboard.css?v=20261122-backdrop-colors-v1' .pages-output/index.html
          node --test test/doweo-polls-dashboard.test.mjs
          node --test test/doweo-desktop-standalone.test.mjs
          test -s .pages-output/styles.css
          test -s .pages-output/doweo-page-repairs.css
          grep -Fq 'doweo-page-repairs.css?v=20261122-backdrop-colors-v1' .pages-output/index.html
          grep -Fq 'UI_RELEASE: doweo-desktop-v5-navy-analytics-20261121' .pages-output/index.html
          grep -Fq 'id="dw-route-visual-enforcer-v6"' .pages-output/index.html
          grep -Fq 'doweo-unified-shell.css?v=20261122-overview-mint-bars-v2' .pages-output/index.html
          grep -Fq 'id="dw-bills-exact-reference-v9"' .pages-output/index.html
          grep -Fq -- '--bg: #0A1B2E' .pages-output/styles.css
          grep -Fq -- '--accent: #60F1AD' .pages-output/styles.css
          node --test test/doweo-css-consolidation.test.mjs
          test -s .pages-output/doweo-unified-shell.css
          test -s .pages-output/doweo-unified-shell.js
          test -s .pages-output/doweo-unified-localize.js
          test -s .pages-output/doweo-unified-locales.mjs
          node --check .pages-output/doweo-unified-shell.js
          node --check .pages-output/doweo-unified-localize.js
          node --check .pages-output/doweo-unified-locales.mjs
          node --test test/doweo-unified-shell.test.mjs
          node --test test/doweo-reference-layout.test.mjs test/doweo-startup-animation.test.mjs
          node --test test/doweo-beta-nudge-theme.test.mjs
          test -s .pages-output/doweo-backdrop-images.js
          test -s .pages-output/third_party/heic2any.min.js
          test -s .pages-output/third_party/UTIF.js
          test -s .pages-output/doweo-core-locales.mjs
          test -s .pages-output/doweo-ui-catalog.mjs
          test -s .pages-output/doweo-localize-ui.js
          test -s .pages-output/beta/index.html
          test -s .pages-output/privacy/index.html
          test -s .pages-output/terms/index.html
          test -s functions/api/beta-signup.js
          cp beta/index.html .pages-output/beta.html
          node --test test/polls-api.test.mjs test/recent-expense-api.test.mjs test/tracker-loading-performance.test.mjs
          node --test test/mobile-ios-install-guide.test.mjs test/mobile-more-inspect.test.mjs test/doweo-mobile-more-flat-grid.test.mjs
          node scripts/verify-pages-assets.mjs .pages-output
          node scripts/verify-backdrop-presets.mjs .pages-output

      # Run Wrangler from the repository root so it discovers ./functions.
      # Uploading through the dashboard would not compile Pages Functions.
      - name: Deploy to doweo.pages.dev
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages-output --project-name=doweo --branch=main

      # A passing build does not prove the public site serves the new release.
      # Fetch the production origin and validate the release marker and palette.
      - name: Verify original backdrop presets are live on production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            page="$(curl --connect-timeout 8 --max-time 15 -fsSL -H 'Cache-Control: no-cache' 'https://doweo.app/?release=original-backdrops-20261122-v1' || true)"
            css="$(curl --connect-timeout 8 --max-time 15 -fsSL -H 'Cache-Control: no-cache' 'https://doweo.app/styles.css?v=20261122-animated-loader-v1' || true)"
            if [[ "$page" == *'restored-original-backdrops-20261122-v1'* ]] &&
               [[ "$page" == *'css: "linear-gradient(135deg, #7c2d12, #be185d)"'* ]] &&
               [[ "$page" == *'css: "linear-gradient(135deg, #14532d, #115e59)"'* ]] &&
               [[ "$page" == *'css: "linear-gradient(135deg, #4a044e, #6b21a8)"'* ]] &&
               [[ "$page" == *'styles.css?v=20261122-animated-loader-v1'* ]] &&
               [[ "$css" == *'--accent: #60F1AD'* ]]; then
              echo "Production is serving the original Sunset, Forest and Berry backdrops with mint accents."
              exit 0
            fi
            echo "Checking updated backdrop release (attempt $attempt of 15)"
            sleep 10
          done
          echo "::error::Cloudflare is not serving the restored original backdrop release."
          exit 1

      - name: Verify mint branding and original color selection on production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            page="$(curl --connect-timeout 8 --max-time 15 -fsSL -H 'Cache-Control: no-cache' 'https://doweo.app/?theme=mint-and-original-backdrops-v1' || true)"
            mint_css="$(curl --connect-timeout 8 --max-time 15 -fsSL -H 'Cache-Control: no-cache' 'https://doweo.app/doweo-reference-home.css?v=20261123-activity-no-lines-v1' || true)"
            mint_js="$(curl --connect-timeout 8 --max-time 15 -fsSL -H 'Cache-Control: no-cache' 'https://doweo.app/doweo-cashflow-analytics.js?v=20261122-original-mint-v1' || true)"
            if [[ "$page" == *'restored-original-backdrops-20261122-v1'* ]] &&
               [[ "$page" == *'id="dw-mobile-critical-colors-v8"'* ]] &&
               [[ "$page" == *'background:#60F1AD!important'* ]] &&
               [[ "$page" == *'doweo-reference-home.css?v=20261123-activity-no-lines-v1'* ]] &&
               [[ "$page" == *'doweo-cashflow-analytics.js?v=20261122-original-mint-v1'* ]] &&
               [[ "$mint_css" == *'background:#60F1AD!important'* ]] &&
               [[ "$mint_js" == *'#60F1AD'* ]]; then
              echo "Production mint accents verified alongside the restored backdrop palette."
              exit 0
            fi
            echo "Checking live mint branding (attempt $attempt of 15)"
            sleep 10
          done
          echo "::error::Live site does not yet serve the current mint and backdrop release."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production verification browser
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Browser-verify animated DoWeo loading logo on mobile and web
        env:
          HOME_BASE_URL: https://doweo.app
        run: node scripts/verify-live-startup-animation.mjs
      - name: Verify actual Instagram popup geometry and active tracker wallpaper
        env:
          HOME_BASE_URL: https://doweo.app
        run: node scripts/verify-desktop-visual-fixes.mjs
      - name: Verify production Home Add expense dropdown and retired tracker category tabs
        env:
          HOME_BASE_URL: https://doweo.app
        run: node --test test/home-add-dropdown.test.mjs
      - name: Verify real Split Bill popup and save with canonical ledger members on doweo.app
        env:
          SPLIT_BASE_URL: https://doweo.app
        run: node --test test/split-bill-member-modal.test.mjs
      - name: Upload Split Bill mobile verification screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-bill-mobile-verification
          path: test-results/split/
      - name: Verify published Bills assets and actual production rendering
        env:
          BILLS_BASE_URL: https://doweo.app
        run: |
          # Execute all independent suites even when one fails, but keep the
          # deployment red until every required verification succeeds.
          set +e
          failures=0
          node scripts/verify-live-bills.mjs || failures=1
          node --test test/recent-expense-details.test.mjs || failures=1
          node --test test/polls-desktop-page.test.mjs || failures=1
          node --test test/home-desktop-navigation.test.mjs || failures=1
          node --test test/bills-full-app.test.mjs || failures=1
          exit "$failures"
      - name: Upload production Bills screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bills-production-screenshots
          path: test-results/bills/
