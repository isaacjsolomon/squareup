name: Test Beta Feedback Center

on:
  pull_request:
  push:
    branches:
      - feature/beta-feedback-center
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check doweo-i18n.js
          node --check doweo-first-run.js
          node --check doweo-translations.js
          node --check doweo-localize-ui.js
          node --check doweo-core-locales.mjs
          node --check functions/api/ui-translate.js
          node --check functions/api/ai-chat.js
          node --check beta-feedback.js
          node --check squareup-events.js
          node --check functions/api/beta-feedback.js
          node --check weo-mascot.js
          node --check functions/api/ai-chat.js
          node --check weo-actions.js
      - name: Verify desktop-only visual consistency and mobile protection
        run: node --test test/desktop-visual-consistency.test.mjs
      - name: Check image import and local decoders
        run: node --check doweo-backdrop-images.js && node --check third_party/UTIF.js && node --check third_party/heic2any.min.js && node --check test/backdrop-image-formats.test.mjs
      - name: Verify all published app assets
        run: node --test test/pages-assets.test.mjs
      - name: Verify seven-minute beta invitation and mint dashboard assets
        run: node --check doweo-beta-nudge.js && node --test test/doweo-beta-nudge-theme.test.mjs
      - name: Verify every production translation module is packaged
        run: node --test test/doweo-production-locale-bundle.test.mjs
      - name: Test complete localization integration and Weo response language
        run: node --test test/doweo-complete-localization.test.mjs
      - name: Test mixed-language and dynamic translation regressions
        run: node --test test/doweo-localization-coverage.test.mjs test/doweo-translation-reliability.test.mjs test/doweo-screenshot-regressions.test.mjs test/doweo-interface-audit.test.mjs test/doweo-financial-tabs-subtitles.test.mjs test/doweo-weo-about-localization.test.mjs test/doweo-financial-spanish-coverage.test.mjs
      - name: Verify mobile More routing and destination isolation
        run: node --test test/mobile-more-inspect.test.mjs
      - name: Verify complete mobile More offline translations and private text safety
        run: node --test test/mobile-more-localization.test.mjs
      - name: Test live translations and settings layout
        run: node --test test/doweo-translations-ui.test.mjs
      - name: Test language detection and preference override
        run: node --test test/doweo-i18n.test.mjs test/doweo-language-flag-grid.test.mjs test/doweo-account-layout-translation.test.mjs test/doweo-create-actions-localization.test.mjs test/doweo-multilingual-core.test.mjs test/doweo-existing-language-quality.test.mjs test/doweo-seven-new-languages.test.mjs
      - name: Verify Settings language control placement
        run: node --test test/settings-language-location.test.mjs
      - name: Run feedback API unit tests (mocked requests, no real emails)
        run: node --test test/beta-feedback.test.mjs
      - name: Test expense recurrence validation before financial writes
        run: node --test test/doweo-recurring-expense-validation.test.mjs
      - name: Verify fast tracker listing, detail reuse and recurring sync behavior
        run: node --test test/tracker-loading-performance.test.mjs
      - name: Verify push notification URL safety and window reuse
        run: node --check sw.js && node --test test/doweo-push-navigation.test.mjs
      - name: Ensure saved entries succeed when notification delivery fails
        run: node --test test/doweo-entry-notification-resilience.test.mjs
      - name: Test payment requests, currency quotes, and Weo consent
        run: node --check 'functions/api/payment-preview/[token].js' && node --check doweo-paylinks-currency.js && node --check functions/api/ai-chat.js && node --test test/doweo-finance-paylinks-ai.test.mjs
      - name: Test trip planning and financial activity timeline
        run: node --check doweo-trips-activity.js && node --test test/doweo-trip-activity.test.mjs
      - name: Test personal budgets and shared savings goals
        run: node --check 'functions/api/finance-plus/[[path]].js' && node --check doweo-finance-planning.js && node --test test/doweo-finance-planning.test.mjs
      - name: Verify expense and payment forms wait for save confirmation
        run: node --test test/doweo-save-confirmation.test.mjs
      - name: Verify guided expense details layout and retained actions
        run: node --test test/doweo-guided-expense-details.test.mjs
      - name: Test expense discussion visibility and recovery
        run: node --test test/doweo-expense-discussion-visibility.test.mjs
      - name: Verify canonical tracker-member names are used for Split Bill savings
        run: node --check doweo-split-bill-modal.js && node --check 'functions/api/[[path]].js' && node --check test/split-bill-member-modal.test.mjs
      - name: Test payment reminder currency and confirmed balance logic
        run: node --test test/doweo-reminder-currency-safety.test.mjs
      - name: Check Personal Finance summary and transaction dialog
        run: node --test test/personal-finance-transaction-ui.test.mjs
      - name: Test search navigation, keyboard access and stale profile results
        run: node --test test/doweo-universal-search-quality.test.mjs
      - name: Check mobile wallet redesign, currency grouping and retained actions
        run: node --test test/mobile-wallet-ui.test.mjs test/doweo-mobile-more-flat-grid.test.mjs
      - name: Verify sidebar keeps More as its only dropdown
        run: node --test test/doweo-flat-sidebar.test.mjs
      - name: Verify retired tracker category bar and the new Overview action dropdown
        run: node --check doweo-trips-activity.js && node --check doweo-home-add-menu.js && node --test test/retired-tracker-category-nav.test.mjs
      - name: Check Bills, Households and mobile Finance Hub tab navigation
        run: node --test test/finance-household-tabs.test.mjs
      - name: Check Weo mascot interactions and accessibility
        run: node --test test/weo-mascot.test.mjs
      - name: Check Weo quick actions and image understanding API
        run: node --test test/weo-quick-actions.test.mjs

  mobile-overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Verify read-only desktop onboarding, preview, checklist, and mobile protection
        run: node --test test/doweo-first-run.test.mjs
      - name: Browser-verify More destinations have independent mobile pages
        run: node --test test/mobile-more-browser-inspect.test.mjs
      - name: Browser-test timed beta invitation on desktop and mobile
        run: node --test test/doweo-beta-nudge-browser.test.mjs
      - name: Browser-verify iPhone Safari Home Screen button is visible and functional
        run: node --test test/mobile-ios-install-guide-browser.test.mjs
      - name: Browser-test mobile Split Bill popup, member saving, and original steps
        run: node --test test/split-bill-member-modal.test.mjs
      - name: Browser-test image formats and actual Backdrop file upload
        run: node --test test/backdrop-image-formats.test.mjs
      - name: Browser-test desktop Home Add expense menu, retired tabs, and mobile preservation
        run: node --test test/home-add-dropdown.test.mjs
      - name: Verify mobile Home information cards are navy and photo backdrop unchanged
        run: node --test test/mobile-home-navy-cards.test.mjs
      - name: Verify mobile viewport foundation across screen sizes
        run: node --test test/mobile-viewport-foundation.test.mjs
      - name: Test bill and subscription editing
        run: node --test test/edit-bills-subscriptions.test.mjs
      - name: Test complete Bills app at iPhone widths
        run: node --test test/bills-full-app.test.mjs
      - name: Upload full app Bills screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bills-full-app-screenshots
          path: test-results/bills/
      - name: Check compact Bills mobile dashboard and calendar behavior
        run: node --check doweo-bills-mobile-dashboard.js && node --test test/mobile-bills-dashboard.test.mjs
      - name: Check new Finance Hub tools on mobile
        run: node --test test/finance-addons-mobile.test.mjs
      - name: Check mobile tracker settings panel sizing and accessibility
        run: node --test test/mobile-tracker-settings-panel.test.mjs
      - name: Verify mobile tracker banner, inline loading, and shortcut cleanup
        run: node --test test/mobile-trackers-banner-loading.test.mjs
      - name: Check mobile Overview visibility, overflow and desktop preservation
        run: node --test test/mobile-tracker-overview.test.mjs


