name: Test Beta Feedback Center

on:
  pull_request:
  push:
    branches:
      - feature/beta-feedback-center
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check beta-feedback.js
          node --check squareup-events.js
          node --check functions/api/beta-feedback.js
          node --check weo-mascot.js
          node --check functions/api/ai-chat.js
          node --check weo-actions.js
      - name: Run all DoWeo regression tests
        run: node --test test/*.test.mjs
