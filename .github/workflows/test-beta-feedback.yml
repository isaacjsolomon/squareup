name: Test Beta Feedback Center

on:
  pull_request:
  push:
    branches:
      - feature/beta-feedback-center
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check beta-feedback.js
          node --check squareup-events.js
          node --check functions/api/beta-feedback.js
      - name: Run feedback API unit tests (mocked requests, no real emails)
        run: node --test test/beta-feedback.test.mjs
      - name: Check Personal Finance summary and transaction dialog
        run: node --test test/personal-finance-transaction-ui.test.mjs
      - name: Check mobile wallet redesign, currency grouping and retained actions
        run: node --test test/mobile-wallet-ui.test.mjs
      - name: Check Bills, Households and mobile Finance Hub tab navigation
        run: node --test test/finance-household-tabs.test.mjs
